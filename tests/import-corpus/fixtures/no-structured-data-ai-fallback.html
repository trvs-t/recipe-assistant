<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ginger Oat Pancakes</title>
  </head>
  <body>
    <article class="recipe-card">
      <h1>Ginger Oat Pancakes</h1>
      <p>Ingredients</p>
      <ul>
        <li>1 cup oat flour</li>
        <li>1 teaspoon ground ginger</li>
        <li>1 cup milk</li>
      </ul>
      <p>Instructions</p>
      <ol>
        <li>Whisk the ingredients into a smooth batter.</li>
        <li>Cook small rounds on a warm pan.</li>
      </ol>
    </article>
  </body>
</html>
